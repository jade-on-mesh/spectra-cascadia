# On every push to main: run the full check (tests, four builds, image checks).
# If FW_VERSION in src/main.cpp has no release yet, tag the commit and publish
# the release with the firmware files. So releasing = pushing a version bump;
# nobody (person or sync task) needs to push tags.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  check-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Cache toolchain sources
        uses: actions/cache@v4
        with:
          path: ~/.spectra-deps
          key: spectra-deps-${{ hashFiles('tools/offline/setup.sh') }}
      - name: Pinned toolchain (same as the sync task and local builds)
        run: tools/offline/setup.sh
      - name: Tests, builds, image checks
        run: tools/ci.sh
      - name: Already released?
        id: ver
        run: |
          V=$(sed -n 's/^#define FW_VERSION *"\(v[^"]*\)".*/\1/p' src/main.cpp)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$V" >/dev/null; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - name: Release notes from CHANGELOG
        if: steps.ver.outputs.new == 'true'
        run: |
          V=${{ steps.ver.outputs.version }}; V=${V#v}
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          cat tools/release-notes-footer.md >> notes.md
      - uses: softprops/action-gh-release@v2.0.8
        if: steps.ver.outputs.new == 'true'
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Spectra-Cascadia ${{ steps.ver.outputs.version }}
          body_path: notes.md
          files: |
            dist/*.hex
            dist/*.bin

  # Informational: the normal `pio run` path (registry packages). Never blocks a release.
  registry-build:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install platformio==6.1.18
      - name: Available Arduino core versions
        run: pio pkg show platformio/framework-arduinoststm32 2>&1 | grep -E "^[0-9]+\.[0-9]+\.[0-9]+" | head -12 | sed 's/^/::notice title=core versions::/' || true
      - run: pio run -e specter -e specter_xl > build.log 2>&1 || { grep -E "error|Error|overflow" build.log | head -15 | sed 's/^/::warning title=registry build::/'; exit 1; }
