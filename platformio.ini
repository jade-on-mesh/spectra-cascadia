; SPECTER, MeshCore Repeater for STM32F103C8T6 + SX1262 (DX-LR30)
;
; Node name: auto-generated from device UID → SPECTER-XXXX (e.g., SPECTER-1811)
; Override: add  -D NODE_NAME_STR=\"MYNAME\"  to build_flags below
;
; Serial: USART1 (PA9=TX, PA10=RX) → CH340 USB adapter @ 115200 8N1
;
; ⚠️  BOOTLOADER FLASH: Use stm32flash -b 57600 (NOT 115200!)
;     This board's bootloader only responds reliably at 57600 baud.
;     See docs/development-notes.md for details.
;
; Every option in src/main.cpp's "Configuration" block can be overridden here
; with -D. The most useful ones are shown (commented) in [env:specter].

[specter_base]
platform   = ststm32
board      = genericSTM32F103CB    ; 128KB flash (many clones), 20KB RAM
framework  = arduino
; Cap the image at 63 KB: the last 1 KB page of the first 64 KB holds the
; clock journal, and genuine C8 parts only have 64 KB.
board_upload.maximum_size = 64512

upload_protocol = serial
upload_speed    = 115200
; ⚠️  DTR/RTS bootloader entry does NOT work on DX-LR30 hardware.
;     Use physical BOOT0+RESET buttons before running stm32flash.
upload_flags =
    -i
    dtr,-rts,rts:-dtr,-rts,rts
monitor_speed = 115200

lib_deps =
    jgromes/RadioLib @ ^7.6.0      ; SX1262 driver (polling mode, RADIOLIB_NC)
    rweather/Crypto @ ^0.4.0       ; SHA256/HMAC + Ed25519

build_flags =
    -D HAL_UART_MODULE_ENABLED     ; Enable UART peripherals
    -D ENABLE_HWSERIAL1            ; Map Serial → USART1 (PA9/PA10, NOT USART2!)
    -D RADIOLIB_STATIC_ONLY=1
    -Os                            ; size-optimized: ~60 KB of the 63 KB budget

; ── US / Canada (MeshCore "USA/Canada (Recommended)": 910.525 / BW62.5 / SF7 / CR5)
[env:specter]
extends     = specter_base
upload_port  = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags =
    ${specter_base.build_flags}
    ; -D LORA_TX_POWER=22                ; dBm (default 20, board max 22)
    ; -D NODE_NAME_STR=\"CM-Woodway-1\"   ; callsign (max 23 chars)
    ; -D NODE_LAT_I=47793000              ; latitude  × 1e6
    ; -D NODE_LON_I=-122383000            ; longitude × 1e6
    ; -D REGIONS=\"se-wa,seattle\"         ; scoped floods to forward (hashtag regions)
    ; -D ADVERT_SCOPE=\"se-wa\"            ; scope our own flood adverts to this region
    ; -D ALLOW_UNSCOPED_FLOOD=0           ; drop un-scoped floods (like a wildcard deny)
    ; -D PATH_HASH_SIZE=2                 ; 1..3 byte path hashes for our own floods
    ; -D IDENTITY_SALT=\"long-random-secret\"  ; changes the key! see README

; ── EU/UK narrow (the original SPECTER settings)
[env:specter_eu]
extends     = specter_base
upload_port  = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags =
    ${specter_base.build_flags}
    -D LORA_FREQ=869.618f
    -D LORA_SF=8
    -D LORA_BW=62.5f
    -D LORA_CR=8
    -D LORA_TX_POWER=14
