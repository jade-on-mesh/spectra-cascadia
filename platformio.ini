; Spectra-Cascadia — MeshCore Repeater for STM32F103C8T6 + SX1262 (DX-LR30)
;
; Settings (name, location, radio, regions, …) are changed over USB serial with
; the same commands as an upstream MeshCore repeater — see README. The -D flags
; below only set the defaults used on first boot or after "erase".
;
; Serial: USART1 (PA9=TX, PA10=RX) → CH340 USB adapter @ 115200 8N1
;
; ⚠️  BOOTLOADER FLASH: Use stm32flash -b 57600 (NOT 115200!)
;     This board's bootloader only responds reliably at 57600 baud.

[specter_base]
platform   = ststm32@20.0.0
board      = genericSTM32F103CB    ; 128KB flash (many clones), 20KB RAM
framework  = arduino
; Cap the image at 62 KB: the top two 1 KB pages of the first 64 KB hold the
; settings and the clock journal, and genuine C8 parts only have 64 KB.
board_upload.maximum_size = 63488

upload_protocol = serial
upload_speed    = 115200
; ⚠️  DTR/RTS bootloader entry does NOT work on DX-LR30 hardware.
;     Use physical BOOT0+RESET buttons before running stm32flash.
upload_flags =
    -i
    dtr,-rts,rts:-dtr,-rts,rts
monitor_speed = 115200

lib_deps =
    jgromes/RadioLib @ 7.6.0       ; SX1262 driver (polling mode, RADIOLIB_NC)
    rweather/Crypto @ 0.4.0        ; SHA256/HMAC + Ed25519

build_flags =
    -D HAL_UART_MODULE_ENABLED     ; Enable UART peripherals
    -D ENABLE_HWSERIAL1            ; Map Serial1 → USART1 (PA9/PA10)
    -D RADIOLIB_STATIC_ONLY=1
    ; Unused STM32 HAL modules — needed to fit in the 62 KB budget
    -D HAL_ADC_MODULE_DISABLED
    -D HAL_I2C_MODULE_DISABLED
    -D HAL_RTC_MODULE_DISABLED
    -D HAL_TIM_MODULE_DISABLED
    -D HAL_DAC_MODULE_DISABLED
    -D HAL_CRC_MODULE_DISABLED
    -D HAL_I2S_MODULE_DISABLED
    -D HAL_SD_MODULE_DISABLED
    -D HAL_PCD_MODULE_DISABLED
    -D HAL_EXTI_MODULE_DISABLED
    -fsingle-precision-constant    ; keeps RadioLib's double-precision helpers out (~2 KB)
    -Os

; ── US / Canada (MeshCore "USA/Canada (Recommended)": 910.525 / BW62.5 / SF7 / CR5)
[env:specter]
extends     = specter_base
upload_port  = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags =
    ${specter_base.build_flags}
    ; First-boot defaults (all changeable later over serial):
    ; -D NODE_NAME_STR=\"CM-Woodway-1\"   ; set name …
    ; -D NODE_LAT_I=47793000              ; set lat …   (× 1e6)
    ; -D NODE_LON_I=-122383000            ; set lon …
    ; -D LORA_TX_POWER=22                 ; set tx …
    ; -D REGIONS=\"se-wa,seattle\"         ; region put …
    ; -D DEFAULT_SCOPE=\"se-wa\"           ; region default …

; ── EU/UK narrow (the original SPECTER settings)
[env:specter_eu]
extends     = specter_base
upload_port  = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags =
    ${specter_base.build_flags}
    -D LORA_FREQ_KHZ=869618
    -D LORA_SF=8
    -D LORA_CR=8
    -D LORA_TX_POWER=14

; ── XL: uses the "hidden" upper 64 KB that most F103C8 chips have (run
;    tools/flash128_test first!). Adds login from the normal MeshCore app:
;    status, telemetry, neighbours and the full CLI over the air.
;    Flash .pio/build/specter_xl/firmware.hex — NOT the .bin (see README).
[specter_xl_base]
extends     = specter_base
board_upload.maximum_size = 131072
board_build.ldscript = specter_xl.ld
extra_scripts = post:tools/xl_hex.py
; "pio run -t upload" goes through OpenOCD with the flash size forced to
; 128 KB (OpenOCD otherwise trusts the chip's 64 KB size register) and
; programs the .hex, so the settings pages are left alone.
upload_protocol = custom
upload_flags =
upload_command = ${platformio.packages_dir}/tool-openocd/bin/openocd -d1 -s ${platformio.packages_dir}/tool-openocd/openocd/scripts -f interface/stlink.cfg -c "transport select hla_swd" -c "set FLASH_SIZE 0x20000" -c "set CPUTAPID 0" -f target/stm32f1x.cfg -c "program {$BUILD_DIR/${PROGNAME}.hex} verify reset; shutdown;"
platform_packages = platformio/tool-openocd
debug_tool = stlink

[env:specter_xl]
extends     = specter_xl_base
build_flags =
    ${specter_base.build_flags}
    -D SPECTER_XL

[env:specter_xl_eu]
extends     = specter_xl_base
build_flags =
    ${specter_base.build_flags}
    -D SPECTER_XL
    -D LORA_FREQ_KHZ=869618
    -D LORA_SF=8
    -D LORA_CR=8
    -D LORA_TX_POWER=14
